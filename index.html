<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Horario PT / AL · Integración</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/calendar.css">
  <link rel="stylesheet" href="./css/school.css">
  <link rel="stylesheet" href="./css/automation.css">
  <link rel="stylesheet" href="./css/center-planning.css">
  <link rel="stylesheet" href="./css/integration.css">
  <link rel="stylesheet" href="./css/capacity-study.css">
  <link rel="stylesheet" href="./css/rosters.css">
  <link rel="stylesheet" href="./css/center-activities.css">
  <link rel="stylesheet" href="./css/temporal-patterns.css">
  <link rel="stylesheet" href="./css/professional-schedule.css">
  <link rel="stylesheet" href="./css/teacher-calendar.css">
</head>
<body>
  <a class="skip-link" href="#mainContent">Saltar al contenido</a>
  <div id="appShell" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">PA</div>
        <div class="brand-copy">
          <strong>Horario PT / AL</strong>
          <small>Rama de integración</small>
        </div>
      </div>
      <nav class="nav-list">
        <button class="nav-item is-active" data-view="calendar" type="button">📅 <span>Horario semanal</span></button>
        <button class="nav-item" data-view="classRosters" type="button">🏫 <span>Clases y alumnado</span></button>
        <button class="nav-item" data-view="students" type="button">👤 <span>Alumnos</span></button>
        <button class="nav-item" data-view="professionals" type="button">🧑‍🏫 <span>Profesorado</span></button>
        <button class="nav-item" data-view="groups" type="button">👥 <span>Grupos PT/AL</span></button>
        <button class="nav-item" data-view="sessions" type="button">🕒 <span>Sesiones PT/AL</span></button>
        <button class="nav-item" data-view="classSchedules" type="button">🗓️ <span>Horarios de aula</span></button>
        <button class="nav-item" data-view="centerPlanning" type="button">🏛️ <span>Plan del centro</span></button>
        <button class="nav-item" data-view="centerActivities" type="button">🧩 <span>Actividades del centro</span></button>
        <button class="nav-item" data-view="temporalPatterns" type="button">🧭 <span>Patrones temporales</span></button>
        <button class="nav-item" data-view="capacityStudy" type="button">📊 <span>Estudio de plantilla</span></button>
        <button class="nav-item" data-view="automation" type="button">⚙️ <span>Configuración automática</span><span id="automationNavBadge" class="nav-badge" aria-label="Estado de configuración">!</span></button>
        <button class="nav-item" data-view="alerts" type="button">⚠️ <span>Conflictos</span></button>
        <button class="nav-item" data-view="operations" type="button">🚨 <span>Operativa diaria</span></button>
        <button class="nav-item" data-view="integration" type="button">🔌 <span>GestorEscuela</span></button>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-data-actions">
          <button id="recessSettingsBtn" class="button button-ghost button-full" type="button">⏸ Configurar recreos</button>
          <button id="exportDataBtn" class="button button-ghost button-full" type="button">⬇ Exportar / compartir</button>
          <button id="importDataBtn" class="button button-ghost button-full" type="button">⬆ Importar horario</button>
          <input id="importDataInput" class="hidden" type="file" accept="application/json,.json">
        </div>
        <button id="resetDemoBtn" class="button button-ghost button-full" type="button">Restaurar datos de ejemplo</button>
        <button id="clearAllDataBtn" class="button button-ghost button-full sidebar-danger" type="button">Vaciar todos los datos</button>
        <small>IndexedDB sigue siendo la fuente local. El backend es opcional.</small>
      </div>
    </aside>

    <main id="mainContent" class="main-content" tabindex="-1">
      <header class="topbar">
        <div class="topbar-title">
          <button id="sidebarToggleBtn" class="icon-button sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Ocultar menú lateral">☰</button>
          <div>
            <p class="eyebrow">Organización semanal</p>
            <h1 id="pageTitle">Horario semanal</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <div id="calendarPrintActions" class="print-actions" role="group" aria-label="Imprimir horario por especialidad">
            <button id="printPTBtn" class="button" type="button">🖨 PT</button>
            <button id="printALBtn" class="button" type="button">🖨 AL</button>
          </div>
          <div class="service-filter" role="group" aria-label="Filtrar por servicio">
            <button type="button" data-service-filter="ALL" class="is-active">Todos</button>
            <button type="button" data-service-filter="PT">PT</button>
            <button type="button" data-service-filter="AL">AL</button>
          </div>
          <button id="primaryActionBtn" class="button button-primary" type="button">+ Nueva sesión</button>
        </div>
      </header>

      <section id="summaryStrip" class="summary-strip" aria-label="Indicadores principales"></section>
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./js/app.js"></script>
  <script type="module" src="./js/class-rosters-controller.js"></script>
  <script type="module" src="./js/center-activities-controller.js"></script>
  <script type="module" src="./js/temporal-patterns-controller.js"></script>
  <script type="module" src="./js/professional-schedule-controller.js"></script>
  <script type="module" src="./js/teacher-calendar-controller.js"></script>
  <script type="module" src="./js/integration-controller.js"></script>
  <script type="module" src="./js/operations-controller.js"></script>
  <script type="module" src="./js/operations-print-controller.js"></script>
  <script type="module" src="./js/capacity-controller.js"></script>
</body>
</html>
