name: Deploy integration preview

on:
  push:
    branches: [integracion-gestor-escuela]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-integration-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}integration/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          path: integration-src

      - name: Verify integration JavaScript and tests
        working-directory: integration-src
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test

      - name: Checkout stable main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Add isolated integration preview
        run: |
          mkdir -p site/integration
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            integration-src/ site/integration/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload stable site and integration preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
