name: Validate integration branch

on:
  push:
    branches: [integracion-gestor-escuela]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run unit tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
