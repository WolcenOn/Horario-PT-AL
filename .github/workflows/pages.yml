name: Validate integration branch

on:
  push:
    branches: [integracion-gestor-escuela]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Verify JavaScript
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test
