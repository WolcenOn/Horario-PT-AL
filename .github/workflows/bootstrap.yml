name: Bootstrap project and deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete project
        shell: bash
        run: |
          cat > /tmp/project.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/project.b64 | tar -xzf - -C .
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Phase 1 application"
          git push origin main

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js _site/
          cp .nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
