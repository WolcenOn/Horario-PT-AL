name: Restore project and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bootstrap-project
  cancel-in-progress: false

jobs:
  restore-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete project archive
        shell: bash
        run: |
          cp README.md /tmp/README.md
          cp package.json /tmp/package.json
          awk '/^H4sI/{print; exit}' .github/workflows/bootstrap.yml > /tmp/project.b64
          test -s /tmp/project.b64
          base64 -d /tmp/project.b64 | tar -xzf - -C .
          cp /tmp/README.md README.md
          cp /tmp/package.json package.json
          rm -f .github/workflows/bootstrap.yml .github/workflows/bootstrap2.yml

      - name: Verify project
        shell: bash
        run: |
          test -f index.html
          test -f js/app.js
          test -f css/base.css
          node --test tests/*.test.mjs

      - name: Commit restored source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Phase 1 application"
          git push origin main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
